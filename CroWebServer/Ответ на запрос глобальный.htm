<html>
<SCRIPT LANGUAGE="javascript" src="%%RestoreScript%%">
</SCRIPT>
<META http-equiv="Content-Type" content="text/html; charset=windows-1251">
<style>.small{font-family:arial;font-size:10pt}.smallinput{font-family:arial;font-size:9pt}</style>
<head><title>Ответ на запрос</title></head>
<body background="bg1.gif" onbeforeUnload="BeforeRestore();" onUnload="SelfRestore();">
<FORM name="Restore" action="%%CGIURL%%" method="post">
<INPUT type="hidden" name="WorkingDirectory" value="%%WorkingDirectory%%">
<INPUT type="hidden" name="LastScreen" value="Восстановить">
</FORM>
<table BORDER=0 CELLSPACING=0>
<tr><td ALIGN=CENTER><H1>Отобрано записей %%RecordCount%%</H1></tr>
</table>
<table BORDER=0 CELLSPACING=0>
<FORM action="%%CGIURL%%" target="_top" method="post" onSubmit="SetCanClose();">
<tr><td ALIGN=RIGHT>Имя банка:&nbsp;&nbsp;<td ALIGN=LEFT>%%BankName%%&nbsp;&nbsp;
<td ALIGN=LEFT><INPUT type="hidden" name="WorkingDirectory" value="%%WorkingDirectory%%">
<INPUT type="submit" name="EndViewBank" value="Возврат"></tr>
</FORM>
<tr><td><hr><td><hr><td><hr></tr>
</table>
<table BORDER=0 CELLSPACING=0 WIDTH="100%">
<FORM action="%%CGIURL%%" method="post" onSubmit="SetCanClose();">
<INPUT type="hidden" name="WorkingDirectory" value="%%WorkingDirectory%%">
<tr>
<td VALIGN=TOP>&nbsp;&nbsp;Количество строк на странице
<td VALIGN=TOP><INPUT name="ViewRows" value="%%ViewRows%%"></tr>
<td VALIGN=TOP><INPUT type="submit" name="PreView" value="Просмотр">
<td VALIGN=TOP><INPUT type="submit" name="PreViewInput" value="Коррекция">
</FORM>
<tr><td><hr><td><hr><td><hr></tr>
%%OutFormsList%%
</table>
</body>
</html>
